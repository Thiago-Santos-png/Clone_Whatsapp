<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- CSS -->
    <link rel="stylesheet" href="main.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="fontawesome/css/all.min.css">
    <title>Whatsapp-Web</title>
</head>

<body>
    <div class="container">
        <aside class="sidebar">
            <div class="toolbar-container">
                <img class="user-photo" src="img/avatar1.png">
                <div class="auxicons-toolbar-container">
                    <i class="fas fa-spinner"></i>
                    <i class="fas fa-comment-alt"></i>
                    <i class="fas fa-ellipsis-v"></i>
                </div>
            </div>
            <div class="notification-container">
                <i class="fas fa-bell-slash"></i>
                <p class="receive-notification">Receba notificações de novas mensagens</p>
                <p class="activate-notification">
                    Ativar notificações na área de trabalho
                    <i class="fas fa-angle-right"></i>
                </p>
            </div>
            <div class="search-container">
                <i id="contact-search" class="fas fa-search"></i>
                <input type="text" id="search" placeholder="Procurar ou começar uma nova conversa">
            </div>
            <div class="contacts-container">
                <div class="contact-box active-chat">
                    <img class="user-photo" src="img/avatar2.png">
                    <div class="user-info">
                        <p class="user-name">Aline Cortês</p>
                        <p class="user-messagepreview">
                            <i class="fa-solid fa-check-double"></i>
                            Oi, tudo bem ?
                        </p>
                    </div>
                    <div class="message-info">
                        <p class="message-time">22:40</p>
                    </div>
                </div>
                <div class="contact-box">
                    <img class="user-photo" src="img/avatar3.png">
                    <div class="user-info">
                        <p class="user-name">Daniel Cortês</p>
                        <p class="user-messagepreview">Bora Jogar um fut man ?</p>
                    </div>
                    <div class="message-info">
                        <p class="message-time">19:00</p>
                        <p class="message-pending">3</p>
                    </div>
                </div>
                <div class="contact-box">
                    <img class="user-photo" src="img/avatar4.png">
                    <div class="user-info">
                        <p class="user-name">Sarah Cristi</p>
                        <p class="user-messagepreview">
                            A Adriele está em casa amigo ?</p>
                    </div>
                    <div class="message-info">
                        <p class="message-time">17:00</p>
                        <p class="message-pending">4</p>
                    </div>
                </div>
            </div>
        </aside>
        <main class="chat-container">
            <nav class="chat-navbar">
                <div class="contactinfo-container">
                    <img class="user-photo" src="img/avatar2.png">
                    <p class="user-name">Adriele Cortês</p>
                </div>
                <ul class="chattools-container">
                    <li><i class="fas fa-search"></i></li>
                    <li><i class="fas fa-paperclip"></i></li>
                    <li><i class="fas fa-ellipsis-v"></i></li>
                </ul>
            </nav>
            <div class="message-container">
                <div class="bg-image"></div>
                <div class="chat-message">
                    <p class="guest-message">Oi Amor, Bom dia</p>
                    <p class="user-message">Bom dia Amor, tudo bem ?</p>
                </div>
            </div>
            <div class="sendmessage-container"> <i class="far fa-smile"></i> <input type="text" id="chatmessage"
                    class="userinput" placeholder="Digite uma mensagem"> <i class="fas fa-microphone"></i> </div>
        </main>
    </div>
</body>

</html>
